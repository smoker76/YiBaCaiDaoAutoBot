name: Build Android 15 Compatible Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q YiBaCaiDaoAutoBot-GitHubUpload.zip -d extracted

      - name: name: Fix accessibility service manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/src/main/AndroidManifest.xml"
          sed -i 's/android:exported="false"/android:exported="true"/g' "$MANIFEST"
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/src/main/AndroidManifest.xml"
          )
          s = p.read_text()

          marker = '<service android:name=".automation.AutomationAccessibilityService"'
          start = s.index(marker)
          end = s.index('/>', start)

          block = s[start:end]
          block = block.replace('android:exported="false"', 'android:exported="true"')

          if 'android:exported="true"' not in block:
              raise SystemExit("Accessibility service exported attribute was not found.")

          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY

      - name: Patch SDK and package
        shell: bash
        run: |
          set -euo pipefail
          APP="extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/build.gradle"
          sed -i "s/compileSdk 34/compileSdk 35/" "$APP"
          sed -i "s/targetSdk 34/targetSdk 35/" "$APP"
          sed -i "s/applicationId 'com.example.yibacaidaobot'/applicationId 'com.example.yibacaidaobot.release'/" "$APP"

      - name: Fix Android gesture callback
        run: |
          sed -i 's/GestureDescription\.GestureResultCallback/AccessibilityService.GestureResultCallback/g'             extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/src/main/java/com/example/yibacaidaobot/automation/AutomationAccessibilityService.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          KEY_ALIAS="yibacaidaobot"

          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/release.p12"             -storetype PKCS12             -storepass "$PASS"             -keypass "$PASS"             -alias "$KEY_ALIAS"             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Yi Ba Cai Dao Auto Bot, OU=Automation, O=Yi Ba Cai Dao, L=Singapore, S=Singapore, C=SG"

          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.p12"
            echo "RELEASE_STORE_PASSWORD=$PASS"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        run: |
          cat >> extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RELEASE_STORE_FILE"))
                      storePassword System.getenv("RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: extracted/YiBaCaiDaoAutoBot-GitHubUpload
        run: gradle --no-daemon clean assembleRelease

      - name: Verify manifest patch
        run: |
          unzip -p extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/build/outputs/apk/release/app-release.apk AndroidManifest.xml >/dev/null
          echo "Release APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YiBaCaiDaoAutoBot-Android16-install-fix-apk
          path: extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
