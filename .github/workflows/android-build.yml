name: Build Android Bot APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q YiBaCaiDaoAutoBot-GitHubUpload.zip -d extracted
          find extracted -maxdepth 3 -type f | sort

      - name: Fix Android gesture callback
        run: |
          sed -i 's/GestureDescription\.GestureResultCallback/AccessibilityService.GestureResultCallback/g' extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/src/main/java/com/example/yibacaidaobot/automation/AutomationAccessibilityService.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'

      - name: Build debug APK
        working-directory: extracted/YiBaCaiDaoAutoBot-GitHubUpload
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YiBaCaiDaoAutoBot-debug-apk
          path: extracted/YiBaCaiDaoAutoBot-GitHubUpload/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
